name: GCP Authentication and Bucket Creation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gcp-auth:
    runs-on: ubuntu-latest

    steps:
      # Checkout code (if needed)
      - name: Checkout code
        uses: actions/checkout@v2

      # Authenticate with Google Cloud using Service Account Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: "admin-443008"          

      # Create Google Cloud Storage Bucket
      - name: Create GCP Bucket
        run: |
          BUCKET_NAME="my-new-bucket-$(date +'%Y%m%d%H%M%S')"  # Generate a unique name
          gsutil mb -l us-central1 gs://$BUCKET_NAME/  # Create the bucket

          echo "Created bucket gs://$BUCKET_NAME"
